tab.advanced.name=Geavanceerd
tab.advanced.bind_address.label=Bind Adres:
tab.advanced.bind_address.tooltip=Het adres ViaProxy inkomende verbindingen op moet accepteren.
tab.advanced.proxy_url.label=Proxy URL:
tab.advanced.proxy_url.tooltip=URL van een SOCKS(4/5)/HTTP(S)-proxy die gebruikt zal worden voor TCP-verbindingen.\n\nOndersteunde formaten:\n- type://adres:poort\n- type://gebruikersnaam:wachtwoord@adres:poort
tab.advanced.proxy_online_mode.label=Proxy Online Modus
tab.advanced.proxy_online_mode.tooltip=Het aanzetten van Proxy Online Modus Verijst dat je client een geldig Minecraft account heeft. Proxy Online modus zorgt ervoor dat skins op online modus kan zien en de ondertekende chat functies.
tab.advanced.legacy_skin_loading.label=Legacy Skin laden
tab.advanced.legacy_skin_loading.tooltip=Door Legacy Skin Laden in te schakelen, kun je skins zien op servers met een versie lager dan 1.6.4.
tab.advanced.chat_signing.label=Chat ondertekening
tab.advanced.chat_signing.tooltip=Zet chat ondertekening aan voor chat berichten op server versies >=1.19.
tab.advanced.ignore_packet_translation_errors.label=Negeer pakket vertaling errors
tab.advanced.ignore_packet_translation_errors.tooltip=Door dit in te schakelen, wordt voorkomen dat de verbinding met de server wordt verbroken wanneer er een pakket vertalingsfout optreedt. In plaats daarvan wordt de fout alleen in de console weergegeven.\nDit kan problemen veroorzaken, afhankelijk van het type pakket dat niet correct is vertaald.
tab.advanced.allow_beta_pinging.label=Toestaan van <= b1.7.3 pinging
tab.advanced.allow_beta_pinging.tooltip=Door deze optie in te schakelen, kunt u servers pingen die versie <= b1.7.3 hebben. Dit kan problemen veroorzaken met servers die te frequente verbindingen blokkeren.
tab.advanced.simple_voice_chat_support.label=Simple Voice Chat-ondersteuning
tab.advanced.simple_voice_chat_support.tooltip=Schakelt in van het verwerken en opnieuw maken van Simple Voice chat mod pakketten.
tab.advanced.fake_accept_resource_packs.label=Neppe acceptatie van resourcepakketten
tab.advanced.fake_accept_resource_packs.tooltip=Accepteert resource pakketten van de server zonder een pop-up to tonen aan de client. Dit is, verijst voor servers die een resource pakket nodig hebben, maar de client hem niet kan laden voor versie verschillen.
